<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice RAG</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Noto Sans Devanagari", sans-serif;
    margin: 0; min-height: 100vh; background: #14102a;
    color: #eee; display: flex; flex-direction: column; align-items: center;
    padding: 32px 16px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #9a93c8; font-size: 13px; margin-bottom: 24px; }
  .card {
    width: 100%; max-width: 640px; background: #1d1838; border: 1px solid #342d5e;
    border-radius: 14px; padding: 20px; margin-bottom: 16px;
  }
  button {
    font-size: 15px; padding: 12px 20px; border-radius: 10px; border: none;
    cursor: pointer; background: #6d5df6; color: #fff; font-weight: 600;
  }
  button.rec { background: #e5484d; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input[type=text] {
    width: 100%; padding: 12px; font-size: 15px; border-radius: 10px;
    border: 1px solid #342d5e; background: #14102a; color: #eee; margin-bottom: 10px;
  }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #status { margin-left: 8px; color: #b7b0e0; font-size: 13px; }
  .label { color: #9a93c8; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; margin: 12px 0 4px; }
  .answer { font-size: 17px; line-height: 1.6; white-space: pre-wrap; }
  .refused { color: #ffb4b6; }
  .src { border-top: 1px solid #2a2447; padding: 8px 0; font-size: 13px; color: #cfc9ee; }
  .src b { color: #9ecbff; }
  .meta { color: #8d86b8; font-size: 12px; margin-top: 12px; }
  #err { color: #ffb4b6; font-size: 13px; margin-top: 8px; }
  .hidden { display: none; }
  .pulse { animation: p 1s infinite; }
  @keyframes p { 50% { opacity: .4; } }
</style>
</head>
<body>
  <h1>🎙️ Voice RAG</h1>
  <div class="sub">Try asking: "What is India's national bird?" — speak or type</div>

  <div class="card">
    <div class="row">
      <button id="recBtn">🎤 Record</button>
      <span id="status">Ready</span>
    </div>
    <div class="label">or type</div>
    <input id="textInput" type="text" placeholder="Type your question…">
    <div class="row">
      <button id="askBtn">Ask</button>
      <span id="err"></span>
    </div>
  </div>

  <div class="card hidden" id="result">
    <div class="label">Your question</div>
    <div id="transcript"></div>
    <div class="label">Answer</div>
    <div id="answer" class="answer"></div>
    <details id="srcDetails" open>
      <summary class="label" style="cursor:pointer">Sources (retrieved passages)</summary>
      <div id="sources"></div>
    </details>
    <div class="meta" id="meta"></div>
  </div>

<script>
"use strict";
/** Look up an element by id; the page is static so all ids exist.
 * @param {string} id
 * @returns {HTMLElement}
 */
const $ = (id) => /** @type {HTMLElement} */ (document.getElementById(id));
const recBtn = $("recBtn"), askBtn = $("askBtn"), statusEl = $("status"), errEl = $("err");
/** @type {HTMLInputElement} */
const input = /** @type {HTMLInputElement} */ ($("textInput"));
const result = $("result");

/** @type {MediaRecorder | null} Active recorder; null when idle. */
let recorder = null;
/** @type {Blob[]} */
let chunks = [];
let activeMime = "";

/**
 * @param {string} t
 * @param {boolean} [pulse]
 */
function setStatus(t, pulse) {
  statusEl.textContent = t;
  statusEl.className = pulse ? "pulse" : "";
}

// Pick the first container/codec the browser actually supports. Chrome:
// webm+opus, Safari: mp4/aac, Firefox: webm+opus (ogg in some builds).
// An empty return means "no explicit type" — the browser default applies.
const MIME_CANDIDATES = [
  "audio/webm;codecs=opus",
  "audio/webm",
  "audio/mp4",
  "audio/ogg;codecs=opus",
];

function pickMimeType() {
  if (typeof MediaRecorder === "undefined") return null;
  for (const mime of MIME_CANDIDATES) {
    try {
      if (MediaRecorder.isTypeSupported(mime)) return mime;
    } catch (_) { /* isTypeSupported can throw on malformed input — keep trying */ }
  }
  return null;
}

/** Upload recorded audio to /v1/voice.
 * @param {Blob} blob
 * @returns {Promise<any>}
 */
async function postVoice(blob) {
  const fd = new FormData();
  fd.append("audio", blob, "speech.wav");
  const res = await fetch("/v1/voice", { method: "POST", body: fd });
  if (!res.ok) throw new Error("voice request failed: " + res.status);
  return res.json();
}

/** POST a text query to /query.
 * @param {string} text
 * @returns {Promise<any>}
 */
async function postText(text) {
  const res = await fetch("/query", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, language: "hi" }),
  });
  if (!res.ok) throw new Error("query failed: " + res.status);
  return res.json();
}

/**
 * @param {Float32Array} data
 * @param {number} fromRate
 * @param {number} toRate
 * @returns {Float32Array}
 */
function downsample(data, fromRate, toRate) {
  if (fromRate === toRate) return data;
  const ratio = fromRate / toRate;
  const n = Math.max(1, Math.floor(data.length / ratio));
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const pos = i * ratio;
    const i0 = Math.floor(pos);
    const frac = pos - i0;
    const s0 = data[i0];
    const s1 = data[Math.min(i0 + 1, data.length - 1)];
    out[i] = s0 + (s1 - s0) * frac;
  }
  return out;
}

/**
 * @param {Float32Array} samples
 * @param {number} sampleRate
 * @returns {ArrayBuffer}
 */
function encodeWav(samples, sampleRate) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  /** @type {(off: number, s: string) => void} */
  const wstr = (off, s) => { for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); };
  wstr(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); wstr(8, "WAVE");
  wstr(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  wstr(36, "data"); v.setUint32(40, samples.length * 2, true);
  let o = 44;
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    o += 2;
  }
  return buf;
}

/** Decode any recorded container and resample to 16 kHz mono WAV.
 * @param {Blob} blob
 * @returns {Promise<Blob>}
 */
async function webmToWav(blob) {
  // OfflineAudioContext(1, 1, 16000) pins the context rate, so decodeAudioData
  // resamples the recording to exactly 16 kHz with the engine's high-quality
  // resampler. A live AudioContext({sampleRate:16000}) is a *suggestion* the
  // browser may ignore (falling back to the 44.1/48 kHz hardware rate), and
  // nearest-neighbor downsampling of that alias-prone. downsample() below is
  // only a defensive fallback for engines that return the buffer at its
  // native rate.
  const ctx = new OfflineAudioContext(1, 1, 16000);
  const audio = await ctx.decodeAudioData(await blob.arrayBuffer());
  const mono = audio.getChannelData(0);
  const pcm = audio.sampleRate === 16000 ? mono : downsample(mono, audio.sampleRate, 16000);
  return new Blob([encodeWav(pcm, 16000)], { type: "audio/wav" });
}

recBtn.addEventListener("click", async () => {
  if (recorder) { recorder.stop(); return; }
  errEl.textContent = "";
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      },
    });
  } catch (e) {
    let msg;
    switch (e.name) {
      case "NotAllowedError":
      case "SecurityError":
        msg = "Microphone access denied — please allow microphone permission in your browser and try again.";
        break;
      case "NotFoundError":
      case "OverconstrainedError":
        msg = "No microphone detected — connect a microphone and try again.";
        break;
      case "NotReadableError":
      case "AbortError":
        msg = "Microphone is busy or unavailable — close other apps using it and try again.";
        break;
      default:
        msg = "Microphone access failed: " + e.message;
    }
    errEl.textContent = msg;
    setStatus("Error");
    return;
  }

  // Resolve a supported mimeType BEFORE constructing the recorder, then read
  // back what the browser actually selected. If no explicit type is supported
  // we still construct without options (browser default), which succeeds on
  // all engines; only a missing MediaRecorder API is fatal here.
  const chosenMime = pickMimeType();
  try {
    recorder = chosenMime ? new MediaRecorder(stream, { mimeType: chosenMime }) : new MediaRecorder(stream);
  } catch (e) {
    stream.getTracks().forEach((t) => t.stop());
    errEl.textContent = "No supported audio format available in this browser (" + e.message + ").";
    setStatus("Error");
    return;
  }
  activeMime = recorder.mimeType || chosenMime || "";
  console.log("[stt] MediaRecorder using mimeType:", activeMime || "(browser default)");

  const audioTrack = stream.getAudioTracks()[0];
  if (audioTrack) {
    const settings = audioTrack.getSettings();
    console.log("[stt] mic capture:", JSON.stringify({
      sampleRate: settings.sampleRate,
      channelCount: settings.channelCount,
      echoCancellation: settings.echoCancellation,
      noiseSuppression: settings.noiseSuppression,
      autoGainControl: settings.autoGainControl,
      mimeType: activeMime,
    }));
  }

  chunks = [];
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop());
    // Snapshot everything we need from the recorder BEFORE dropping the
    // reference — reading .mimeType after `recorder = null` is exactly the
    // crash this used to be.
    const mime = activeMime || "audio/webm";
    recorder = null;
    recBtn.textContent = "🎤 Record";
    recBtn.classList.remove("rec");
    if (!chunks.length) { setStatus("No audio captured"); return; }
    setStatus("Processing…", true);
    try {
      const rawBlob = new Blob(chunks, { type: mime });
      console.log("[stt] raw capture:", rawBlob.size, "bytes", mime);
      const wav = await webmToWav(rawBlob);
      console.log("[stt] converted WAV:", wav.size, "bytes, 16kHz mono s16le");
      await showResult(await postVoice(wav));
    } catch (e) { errEl.textContent = "Error: " + e.message; setStatus("Error"); }
  };
  recorder.start();
  recBtn.textContent = "⏹ Stop";
  recBtn.classList.add("rec");
  setStatus("Listening…", true);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.isComposing) askBtn.click();
});

askBtn.addEventListener("click", async () => {
  const text = input.value.trim();
  if (!text) return;
  errEl.textContent = "";
  setStatus("Processing…", true);
  try { await showResult(await postText(text)); }
  catch (e) { errEl.textContent = "Error: " + e.message; setStatus("Error"); }
});

// Response shape of /query and /v1/voice.
/**
 * @param {{transcript: string, transcript_language?: string|null,
 *   refused?: boolean, refusal_reason?: string|null, answer?: string|null,
 *   sources?: Array<{chunk_id: string, passage: string}>,
 *   timings_ms?: Record<string, number>}} r
 */
function showResult(r) {
  result.classList.remove("hidden");
  $("transcript").textContent = r.transcript;
  const a = $("answer");
  a.className = "answer" + (r.refused ? " refused" : "");
  a.textContent = r.refused
    ? "⚠️ " + (r.refusal_reason || "This question cannot be answered")
    : (r.answer || "No answer");
  const srcs = $("sources");
  srcs.innerHTML = "";
  (r.sources || []).forEach((s) => {
    const d = document.createElement("div");
    d.className = "src";
    d.innerHTML = "<b>[" + s.chunk_id.slice(-6) + "]</b> " + s.passage.slice(0, 160);
    srcs.appendChild(d);
  });
  /** @type {HTMLDetailsElement} */ ($("srcDetails")).open = !r.refused;
  const t = r.timings_ms || {};
  $("meta").textContent = "total " + (t.total_ms !== undefined ? t.total_ms.toFixed(1) + " ms" : "—")
    + " · retrieval " + (t.retrieval_ms !== undefined ? t.retrieval_ms.toFixed(1) + " ms" : "—")
    + " · stt " + (t.stt_ms !== undefined ? t.stt_ms.toFixed(1) + " ms" : "—");
  setStatus("Ready");
}
</script>
</body>
</html>
